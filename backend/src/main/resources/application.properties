spring.application.name=SIGER
# Etiqueta visible del entorno (vacia en el servicio institucional; el perfil local la muestra).
siger.environment-label=${SIGER_ENVIRONMENT_LABEL:}
server.address=${SIGER_BIND:127.0.0.1}
server.port=${SIGER_PORT:18543}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SIGERA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SIGER_HTTPS:false}
server.ssl.enabled=${SIGER_HTTPS:false}
server.ssl.key-store=${SIGER_KEYSTORE:}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SIGER_TLS_PASSWORD:}
server.tomcat.max-part-count=10
spring.datasource.url=${SIGER_DB_URL}
spring.datasource.username=${SIGER_DB_USER}
spring.datasource.password=${SIGER_DB_PASSWORD}
# Los comandos esperan el lock global con su conexion; las lecturas toman una por sentencia.
# Ajustable en la VM sin recompilar (validar con prueba de carga antes de subirlo).
spring.datasource.hikari.maximum-pool-size=${SIGER_DB_POOL_MAX:6}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=${SIGER_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.location=${SIGER_TEMP:./var/tmp}
siger.data=${SIGER_DATA:./var}
siger.seed-demo=${SIGER_SEED_DEMO:false}
# Inicializacion institucional (excluyente con seed-demo): archivo del operador con ambitos reales, TI y autoridad.
siger.bootstrap-file=${SIGER_BOOTSTRAP_FILE:}
# Liberacion de originales: solo tras analisis antivirus del servidor (NONE, CLAMAV o DEFENDER). La liberacion manual
# sin motor existe unicamente en instancias de pruebas (synthetic-release=true).
siger.documents.synthetic-release=${SIGER_DOCUMENTS_SYNTHETIC_RELEASE:false}
siger.documents.av.engine=${SIGER_AV_ENGINE:NONE}
siger.documents.av.executable=${SIGER_AV_EXECUTABLE:}
siger.documents.av.database=${SIGER_AV_DATABASE:}
siger.migrate-only=false
siger.folio-prefix=${SIGER_FOLIO_PREFIX:COM-A}
# Claves publicas Ed25519 confiables del Formulario ({keyId: PEM}). Vacio: se rechaza todo original externo.
siger.formulario-trusted-keys=${SIGER_FORMULARIO_TRUSTED_KEYS:}
# Consumidor PULL/ACK del Formulario: inactivo salvo enabled=true y UN modo: run-once=true (ciclo manual en un
# proceso sin web, scripts\Invoke-FormularioPull.ps1) o automatic=true (permanente en el servicio, con
# single-consumer-confirmed=true: el consumidor de SMR detenido). Por defecto el servicio no consume la cola.
siger.scheduling=${SIGER_SCHEDULING:true}
siger.formulario.pull.enabled=${SIGER_FORMULARIO_PULL_ENABLED:false}
siger.formulario.pull.run-once=${SIGER_FORMULARIO_PULL_RUN_ONCE:false}
siger.formulario.pull.automatic=${SIGER_FORMULARIO_PULL_AUTOMATIC:false}
# Sonda previa a la activacion: valida configuracion y origen sin reclamar entregas (Invoke-FormularioPull -SoloComprobar).
siger.formulario.pull.probe=${SIGER_FORMULARIO_PULL_PROBE:false}
siger.formulario.pull.single-consumer-confirmed=${SIGER_FORMULARIO_PULL_SINGLE_CONSUMER:false}
siger.formulario.pull.poll-ms=${SIGER_FORMULARIO_PULL_POLL_MS:15000}
siger.formulario.pull.origin=${SIGER_FORMULARIO_PULL_ORIGIN:}
siger.formulario.pull.token=${SIGER_FORMULARIO_PULL_TOKEN:}
siger.formulario.pull.token-file=${SIGER_FORMULARIO_PULL_TOKEN_FILE:}
siger.formulario.pull.ca-file=${SIGER_FORMULARIO_PULL_CA_FILE:}
siger.formulario.pull.scope=${SIGER_FORMULARIO_PULL_SCOPE:}
siger.formulario.ack.key-id=${SIGER_FORMULARIO_ACK_KEY_ID:}
siger.formulario.ack.private-key-file=${SIGER_FORMULARIO_ACK_PRIVATE_KEY_FILE:}
siger.formulario.ack.public-key-file=${SIGER_FORMULARIO_ACK_PUBLIC_KEY_FILE:}
# Par ACK como texto PEM (identidad existente descifrada desde DPAPI por el lanzador); tiene prioridad sobre los archivos.
siger.formulario.ack.private-key=${SIGER_FORMULARIO_ACK_PRIVATE_KEY:}
siger.formulario.ack.public-key=${SIGER_FORMULARIO_ACK_PUBLIC_KEY:}
# Correo institucional por Microsoft Graph con outbox durable: OFF (por defecto) o GRAPH. El secreto llega solo como
# variable del proceso desde DPAPI. GRAPH exige dominios institucionales permitidos.
siger.mail.mode=${SIGER_MAIL_MODE:OFF}
siger.mail.graph.tenant=${SIGER_GRAPH_TENANT:}
siger.mail.graph.client=${SIGER_GRAPH_CLIENT:}
siger.mail.graph.sender=${SIGER_GRAPH_SENDER:}
siger.mail.graph.secret=${SIGER_GRAPH_CLIENT_SECRET:}
siger.mail.allowed-domains=${SIGER_MAIL_ALLOWED_DOMAINS:}
siger.mail.link=${SIGER_MAIL_LINK:}
# Servicio permanente: parada ordenada por archivo (run\stop.request), cierre gradual y log rotativo propio.
siger.stop-file=${SIGER_STOP_FILE:}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.file.name=${SIGER_LOG_FILE:}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.root=INFO
logging.level.org.springframework.security=WARN
