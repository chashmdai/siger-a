# Solo para desarrollo LOCAL, datos sinteticos; no sustituye MySQL de la VM.
spring.datasource.url=jdbc:h2:file:./var/local-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${SIGER_LOCAL_DB_PASSWORD:}
spring.flyway.enabled=true
siger.seed-demo=true
server.address=127.0.0.1
server.ssl.enabled=false
server.servlet.session.cookie.secure=false
siger.environment-label=Entorno local de desarrollo \u00b7 Datos sint\u00e9ticos
